name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"

      - name: install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: check rust formatting
        run: bun run rust:fmt:check

      - name: check types
        run: bun run check-types

      - name: build extension runtime
        run: bun run extension-manager:build

      - name: build web
        run: bun run web:build

      - name: build desktop frontend
        run: bun run desktop:frontend:build

      - name: cargo build
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  checks-macos:
    runs-on: macos-14

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install protobuf
        run: brew install protobuf

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build extension runtime
        run: bun run extension-manager:build

      - name: check rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: cargo check (macos backend)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib

      - name: cargo test (macos backend)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib

  windows-checks:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install protobuf compiler
        run: choco install protoc -y --no-progress

      # The tauri build script bundles binaries/extension-manager.cjs, so the
      # runtime must exist before any cargo invocation in this job.
      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build extension runtime
        run: bun run extension-manager:build

  gpui-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install linux dependencies (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libudev-dev \
            protobuf-compiler

      - name: cargo check (gpui workspace)
        run: cargo check --workspace --all-targets --locked

      - name: cargo test (beam-core)
        run: cargo test -p beam-core --locked
