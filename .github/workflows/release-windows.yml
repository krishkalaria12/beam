name: release-windows

# GPUI build: cargo builds the binary, NSIS installer registers the URL
# schemes. No WebView2 bootstrapper (plan §done).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install protobuf compiler
        run: choco install protoc nsis -y --no-progress

      - name: build release binary
        run: cargo build --release --package beam
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1

      - name: stage installer files
        shell: bash
        run: |
          mkdir -p installer
          cp target/rust/release/beam.exe installer/beam.exe
          cp infra/windows/installer.nsi installer/installer.nsi

      - name: build NSIS installer (registers URL schemes)
        shell: bash
        run: |
          makensis -V2 -DVERSION="${GITHUB_REF_NAME#v}" installer/installer.nsi
          mkdir -p release-assets
          mv installer/beam-setup.exe release-assets/beam-${GITHUB_REF_NAME#v}-setup.exe

      - name: collect release artifacts
        shell: bash
        run: |
          cp target/rust/release/beam.exe release-assets/beam-windows-x64.exe
          ls -la release-assets

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
