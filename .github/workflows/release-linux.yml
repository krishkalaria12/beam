name: release-linux

# GPUI build: cargo builds the binary, cargo-deb / cargo-generate-rpm
# produce the packages, AppImage via linuxdeploy. No webkit2gtk, no
# node runtime, no bun (plan §done).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install linux dependencies (gpui runtime + packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libudev-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libdbus-1-dev \
            rpm \
            protobuf-compiler

      - name: build release binary
        run: cargo build --release --package beam

      - name: install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: build deb
        run: cargo deb --package beam --no-build --output release-assets/

      - name: build rpm
        run: |
          mkdir -p release-assets
          cargo generate-rpm --package beam \
            --output release-assets/beam-${GITHUB_REF_NAME#v}-x86_64.rpm

      - name: stage appdir (appimage)
        run: |
          mkdir -p appdir/usr/bin appdir/usr/share/applications
          cp target/rust/release/beam appdir/usr/bin/beam
          cp infra/aur/beam-launcher-bin/beam.desktop appdir/usr/share/applications/beam.desktop
          curl -fsSL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage

      - name: build appimage
        run: |
          ./linuxdeploy.AppImage --appdir appdir --output appimage
          mv beam*.AppImage release-assets/beam-${GITHUB_REF_NAME#v}-x86_64.AppImage

      - name: build tarball (for AUR)
        run: |
          tar -czf release-assets/beam-linux-x86_64.tar.gz -C target/rust/release beam

      - name: collect release artifacts
        run: ls -la release-assets

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.AppImage
            release-assets/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-aur:
    runs-on: ubuntu-22.04
    needs: build-release

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: check aur secret
        id: aur_secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping AUR publish because AUR_SSH_PRIVATE_KEY is not configured."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: load aur ssh key
        if: steps.aur_secret.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: trust aur host
        if: steps.aur_secret.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: clone aur repo
        if: steps.aur_secret.outputs.enabled == 'true'
        run: git clone ssh://aur@aur.archlinux.org/beam-launcher-bin.git aur-beam-launcher-bin

      - name: render aur package files (gpui PKGBUILD)
        if: steps.aur_secret.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp infra/aur/beam-launcher-bin/PKGBUILD.gpui aur-beam-launcher-bin/PKGBUILD
          cp infra/aur/beam-launcher-bin/beam.desktop aur-beam-launcher-bin/beam.desktop
          # Regenerate .SRCINFO from the PKGBUILD
          docker run --rm -v "$PWD/aur-beam-launcher-bin:/pkg" archlinux:base-devel \
            bash -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"

      - name: commit and push aur update
        if: steps.aur_secret.outputs.enabled == 'true'
        run: |
          if [ -z "$(git -C aur-beam-launcher-bin status --porcelain)" ]; then
            echo "No AUR changes to publish."
            exit 0
          fi

          git -C aur-beam-launcher-bin add PKGBUILD .SRCINFO beam.desktop
          git -C aur-beam-launcher-bin -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "beam-launcher-bin ${GITHUB_REF_NAME#v} (GPUI build)"
          git -C aur-beam-launcher-bin push
