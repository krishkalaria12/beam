[package]
name = "beam"
description = "A blazing-fast, open-source command launcher for Linux, macOS, and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beam"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Krish Kalaria <beam@krishkalaria.dev>"
copyright = "2024, Krish Kalaria"
extended-description = """A blazing-fast, open-source command launcher.
Native GPUI build: no webview, no node runtime."""
depends = "$auto, libxkbcommon0, libwayland-client0, libfontconfig1, libx11-6, libxcursor1, libxrandr2, libxi6"
section = "utils"
priority = "optional"
assets = [
    ["target/rust/release/beam", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/rust/release/beam", dest = "/usr/bin/beam", mode = "755" },
]
[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
wayland = "*"
fontconfig = "*"

[dependencies]
beam-core = { path = "../beam-core" }
beam-services = { path = "../beam-services" }
beam-ui = { path = "../beam-ui" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
chrono = "0.4"
nanoid = "0.4"

# Runtime-agnostic channels: bridge the global-hotkey thread and the
# activation-socket thread into gpui's executor without pulling a tokio
# runtime into the UI process.
async-channel = "2"
env_logger = "0.11"

# Standalone replacement for tauri-plugin-global-shortcut. macOS only for now:
# Linux uses portal+evdev and Windows uses RegisterHotKey, both of which come
# over with their existing native implementations in the services migration
# (plan lane A5).
[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = { workspace = true }

# gpui-component + its vendored assets (icons)
gpui-component = { workspace = true }
gpui-component-assets = { path = "../../third-party/gpui-component/assets" }
