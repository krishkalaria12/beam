[package]
name = "beam-services"
description = "The existing src-tauri module tree, preserved 1:1 with the Tauri attachment removed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beam-core = { path = "../beam-core" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
crossbeam-channel = { workspace = true }

# File system & search
ignore = "0.4"
walkdir = "2.5"
notify = { version = "6", features = ["crossbeam-channel"] }
notify-debouncer-mini = "0.7"
nucleo = "0.5"

# Date & time
chrono = "0.4"
chrono-tz = "0.10"

# System & desktop integration
dirs = "6.0"
shell-words = "1.1"
num_cpus = "1.17"
webbrowser = "1.1"
system_shutdown = "4.1"
keepawake = "0.6"
sysinfo = "0.29"

# HTTP & networking
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tiny_http = "0.12"
url = "2.5"

# DB
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
nanoid = "0.4"

# Serialization (file index cache)
rkyv = { version = "0.7.46", features = ["validation"] }
bytecheck = "0.6.12"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Utilities
once_cell = "1.21"
papaya = "0.2"
rayon = "1.10"
regex = "1.12"
open = "5.3"
smart-calculator = "1.0.3"
whichlang = "0.1"
scraper = "0.25"
