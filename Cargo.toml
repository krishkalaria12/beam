[workspace]
resolver = "3"
members = [
    "crates/beam-core",
    "crates/beam-services",
    "crates/beam-ui",
    "crates/beam",
    # Vendored longbridge/gpui-component 0.5.2 (rev 7885c416): kept as
    # workspace members so their `gpui = { workspace = true }` resolves to
    # OUR pinned zed rev — a plain git dependency would vendor a second gpui
    # and the traits would not unify. The manifests were severed from their
    # original workspace (editions inlined, lints local, wasm reqwest
    # dropped); see third-party/gpui-component/VENDORED.md.
    "third-party/gpui-component/base",
    "third-party/gpui-component/macros",
    "third-party/gpui-component/assets",
    "third-party/gpui-component/ui",
]
exclude = ["apps/desktop"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krishkalaria12/beam"

# GPUI is pre-1.0 and breaks between revisions: every gpui-family crate is
# pinned to ONE upstream rev here and must be bumped as its own task with its
# own smoke pass (docs/gpui-migration-plan.html §03 "Pin discipline").
# The rev and the reason it was chosen are recorded in docs/parity/gpui-pin.md.
#
# The rev is the one longbridge/gpui-component 0.5.2 is tested against
# (their Cargo.lock), so the component library and the framework compile
# from the same source. The [patch] section below rewrites
# gpui-component's own unpinned `git = "…/zed"` dependency onto that rev —
# without it cargo would vendor two gpui copies and the traits would not
# unify.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc", features = [
    "wayland",
    "x11",
    "font-kit",
    # Compile Metal shaders at runtime instead of requiring the `metal`
    # CLI at build time, so machines with only Command Line Tools can build.
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc" }
gpui-component = { path = "third-party/gpui-component/ui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
parking_lot = "0.12"
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
] }
futures-util = "0.3"
crossbeam-channel = "0.5"

# Standalone replacement for tauri-plugin-global-shortcut (macOS only; the
# Linux and Windows hotkey backends are already native and come over with the
# services migration).
global-hotkey = "0.8"

# Vendored gpui-component internals (see members above).
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc" }


[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
